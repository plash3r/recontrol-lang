name: Apply archive update

on:
  push:
    branches:
      - update/compiler-archive-2026-09-21
    paths:
      - ".update_payload.part*"
      - ".github/workflows/apply-archive-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/compiler-archive-2026-09-21
          fetch-depth: 0

      - name: Apply archive payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .update_payload.part01 ]]; then
            echo "No payload to apply"
            exit 0
          fi
          cat .update_payload.part* > /tmp/update_payload.b64
          base64 --decode /tmp/update_payload.b64 > /tmp/update_payload.tar.gz
          tar -tzf /tmp/update_payload.tar.gz
          tar -xzf /tmp/update_payload.tar.gz -C .
          rm -f .update_payload.part*

      - name: Commit extracted update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update compiler from newer archive [archive-applied]"
          git push origin HEAD:update/compiler-archive-2026-09-21

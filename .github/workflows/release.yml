name: Build and release RCL

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rcl-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rcl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm -y

      - name: Build RCL and bundled runtime
        run: |
          cargo build --release --package rcl --package rcl-runtime --target ${{ matrix.target }}

      - name: Package compiler and runtime
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/rcl.exe" "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/rcl_runtime.lib" "dist/rcl_runtime.lib"
          else
            cp "target/${{ matrix.target }}/release/rcl" "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/librcl_runtime.a" "dist/librcl_runtime.a"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: ${{ github.sha }}
          name: Recontrol Lang v0.1.1
          generate_release_notes: true
          files: dist/*

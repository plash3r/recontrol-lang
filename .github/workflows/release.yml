name: Build and release RCL

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_asset: rcl-linux-x86_64
            runtime_asset: rcl-runtime-linux-x86_64.a
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_asset: rcl-windows-x86_64.exe
            runtime_asset: rcl-runtime-windows-x86_64.lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm -y

      - name: Build compiler and runtime
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/rcl.exe" "dist/${{ matrix.binary_asset }}"
            cp "target/${{ matrix.target }}/release/rcl_runtime.lib" "dist/${{ matrix.runtime_asset }}"
          else
            cp "target/${{ matrix.target }}/release/rcl" "dist/${{ matrix.binary_asset }}"
            cp "target/${{ matrix.target }}/release/librcl_runtime.a" "dist/${{ matrix.runtime_asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_asset }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum rcl-* > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.2' }}
          target_commitish: ${{ github.sha }}
          name: Recontrol Lang ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.2' }}
          generate_release_notes: true
          files: dist/*

name: Build and release RCL

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rcl-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rcl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build compiler
        run: cargo build --release --package rcl --target ${{ matrix.target }}

      - name: Smoke test compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > smoke.rcl <<'EOF'
          fn main() {
              println("Hello, Recontrol!")
          }
          EOF
          output="$(./target/${{ matrix.target }}/release/rcl run smoke.rcl)"
          test "$output" = "Hello, Recontrol!"

      - name: Smoke test compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          fn main() {
              println("Hello, Recontrol!")
          }
          '@ | Set-Content smoke.rcl
          $output = & ".\target\${{ matrix.target }}\release\rcl.exe" run smoke.rcl
          if ($output -ne "Hello, Recontrol!") {
            throw "Unexpected compiler output: $output"
          }

      - name: Package compiler
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/rcl.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/rcl" "dist/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Remove obsolete v0.1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.1.3 --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          target_commitish: ${{ github.sha }}
          name: Recontrol Lang v0.1.4
          generate_release_notes: true
          files: dist/*

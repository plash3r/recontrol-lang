name: Build and release RCL

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rcl-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rcl-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm -y

      - name: Build RCL and bundled runtime
        run: |
          cargo build --release --package rcl --package rcl-runtime --target ${{ matrix.target }}

      - name: Package compiler, runtime and bundled native toolchain
        shell: bash
        run: |
          set -eux
          mkdir -p dist/rcl-toolchain/bin dist/rcl-toolchain/lib
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/rcl.exe" "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/rcl_runtime.lib" "dist/rcl_runtime.lib"
            cp "C:/Program Files/LLVM/bin/clang.exe" "dist/rcl-toolchain/bin/clang.exe"
            cp "C:/Program Files/LLVM/bin/lld-link.exe" "dist/rcl-toolchain/bin/lld-link.exe"
            cp "C:/Program Files/LLVM/bin/"*.dll dist/rcl-toolchain/bin/
            cp -r "C:/Program Files/LLVM/lib/clang" dist/rcl-toolchain/lib/
            (cd dist && 7z a -tzip "rcl-toolchain-windows-x86_64.zip" rcl-toolchain >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/rcl" "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/librcl_runtime.a" "dist/librcl_runtime.a"
            clang_bin="$(readlink -f "$(command -v clang)")"
            llvm_root="$(dirname "$(dirname "$clang_bin")")"
            cp "$clang_bin" "dist/rcl-toolchain/bin/clang"
            cp "$(readlink -f "$(command -v ld.lld)")" "dist/rcl-toolchain/bin/ld.lld"
            cp -r "$llvm_root/lib/clang" dist/rcl-toolchain/lib/
            for lib in "$llvm_root"/lib/libLLVM*.so* "$llvm_root"/lib/libclang-cpp*.so*; do
              [[ -e "$lib" ]] && cp -a "$lib" dist/rcl-toolchain/lib/
            done
            (cd dist && tar -czf "rcl-toolchain-linux-x86_64.tar.gz" rcl-toolchain)
          fi
          rm -rf dist/rcl-toolchain

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          target_commitish: ${{ github.sha }}
          name: Recontrol Lang v0.1.2
          generate_release_notes: true
          files: dist/*
